name: Build check

# The site is hosted on Netlify (https://silvercrest-lighting.netlify.app) and deployed with the
# Netlify CLI or Netlify's own Git integration. This workflow no longer deploys anywhere (it used to
# deploy to Cloudflare Pages); it only makes sure every push still builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
